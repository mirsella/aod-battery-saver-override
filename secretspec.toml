[project]
name = "aod-battery-saver-override"
revision = "1.0"

[providers]
proton = "protonpass://secretspec/{project}/{profile}/{key}"

[profiles.default.defaults]
providers = ["proton"]

[profiles.default]
RELEASE_KEYSTORE_BASE64 = { description = "Base64-encoded release PKCS12 keystore, alias aod-saver-override", required = true, type = "password" }
RELEASE_KEYSTORE_PASSWORD = { description = "Release keystore and key password", required = true, type = "password" }
